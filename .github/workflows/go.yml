name: Go and Auto Tag (v0.yy.m-dhhmm)

on: [push, workflow_dispatch]

env:
  GOTOOLCHAIN: local

jobs:
  migrate-whatsmeow:
    name: Migrate Whatsmeow Import Path (PR)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write
      pull-requests: write

    outputs:
      pr_created: ${{ steps.pr.outputs.pull-request-number != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check for upstream import path
        id: check_imports
        run: |
          if grep -R --include="*.go" -q "go.mau.fi/whatsmeow" .; then
            echo "needs_migration=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_migration=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace whatsmeow import path (only .go files)
        if: steps.check_imports.outputs.needs_migration == 'true'
        run: |
          set -e
          find . -type f -name "*.go" \
            -not -path "./vendor/*" \
            -not -path "./.github/*" \
            -print0 \
          | xargs -0 sed -i.bak 's|go.mau.fi/whatsmeow|github.com/PakaiWA/whatsmeow|g' || true

          find . -type f -name "*.bak" -delete

      - name: Create Pull Request (via BOT token)
        id: pr
        if: steps.check_imports.outputs.needs_migration == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.PAKAIWA_ACTION_BOT }}
          title: "chore: migrate whatsmeow import path"
          commit-message: "chore: replace go.mau.fi/whatsmeow with github.com/PakaiWA/whatsmeow"
          branch: chore/migrate-whatsmeow
          delete-branch: true

      - name: Stop pipeline if PR was created
        if: steps.pr.outputs.pull-request-number != ''
        run: |
          echo "PR dibuat (#${{ steps.pr.outputs.pull-request-number }}). Hentikan pipeline."
          exit 1

  build:
    runs-on: ubuntu-latest
    needs: migrate-whatsmeow
    if: always() && (needs.migrate-whatsmeow.result == 'success' || needs.migrate-whatsmeow.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]
    name: Build ${{ matrix.go-version == '1.27' && '(latest)' || '(old)' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go CLI Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ matrix.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-${{ matrix.go-version }}-
            ${{ runner.os }}-go-tools-

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Install dependencies
        run: |
          echo "$HOME/go/bin" >> $GITHUB_PATH
          command -v protoc-gen-go >/dev/null 2>&1 || go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          command -v goimports >/dev/null 2>&1 || go install golang.org/x/tools/cmd/goimports@latest
          command -v staticcheck >/dev/null 2>&1 || go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          # go 1.26's formatter doesn't agree with 1.27 on some things
          SKIP: ${{ matrix.go-version == '1.26' && 'go-imports-repo' || '' }}

  create-tag:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    env:
      TZ: Asia/Jakarta
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Hitung versi tag (WIB)
        id: ver
        run: |
          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          yy=$(date +%y)
          m=$(date +%-m)
          d=$(date +%-d)
          HH=$(date +%H)
          MM=$(date +%M)

          tag="v0.${yy}.${m}-${d}${HH}${MM}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag yang akan dibuat: $tag"

      - name: Cek apakah tag sudah ada
        id: check
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Buat dan push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Auto tag $tag"
          git push origin "$tag"
